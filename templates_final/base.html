<!DOCTYPE html>
<html class="wide wow-animation" lang="en">
  <head>
    <title>Home</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <link rel="icon" href="{{ url_for('static', filename='images/favicon.ico') }}" type="image/x-icon">
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Roboto:400,500,300,300italic,500%7CNoto+Serif:400italic,700%7CNoto+Sans:700,700italic">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>.ie-panel{display: none;background: #212121;padding: 10px 0;box-shadow: 3px 3px 5px 0 rgba(0,0,0,.3);clear: both;text-align:center;position: relative;z-index: 1;} html.ie-10 .ie-panel, html.lt-ie-10 .ie-panel {display: block;}</style>
  </head>
  <body>
    <div class="preloader">
      <div class="preloader-body">
        <div class="cssload-container">
          <div class="cssload-speeding-wheel"></div>
        </div>
        <p>Loading...</p>
      </div>
    </div>
    <div class="page">
     {% include 'includes/header.html' %}
     
     {% block content %}{% endblock %}

     {% include 'includes/footer.html' %}
    </div>
    <div class="snackbars" id="form-output-global"></div>
    <script src="{{ url_for('static', filename='js/core.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
      // The infinite "Loading..." is caused by the browser restoring this page
      // from the bfcache on back/forward navigation. In that case the preloader
      // snapshot is restored but script.js never re-runs to hide it.
      //
      // pageshow fires on EVERY show, including bfcache restores. When
      // event.persisted is true (or the nav type is back_forward), force a
      // full reload so all scripts run again and the preloader clears.
      (function () {
        function isBackForwardNav() {
          if (!window.performance) return false;

          var navEntries = window.performance.getEntriesByType
            ? window.performance.getEntriesByType("navigation")
            : [];

          if (navEntries.length > 0 && navEntries[0].type === "back_forward") {
            return true;
          }

          // Fallback for older browsers
          return (
            window.performance.navigation &&
            window.performance.navigation.type === 2
          );
        }

        window.addEventListener("pageshow", function (event) {
          if (event.persisted || isBackForwardNav()) {
            window.location.reload();
          }
        });
      })();
    </script>
  </body>
</html>
