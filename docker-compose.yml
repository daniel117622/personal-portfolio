version: '3.8'

services:
  web:
    build: .
    container_name: kuhaku_web
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo_db:27017/
      - USE_MOCK=False
    depends_on:
      - mongo_db

  mongo_db:
    image: mongo:7.0
    container_name: mongo_db
    command: mongod --auth
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data: