version: '3.8'

services:
  web:
    build: .
    container_name: kuhaku_web
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=${MONGO_URI}
      - USE_MOCK=${USE_MOCK}
    depends_on:
      - mongo_db

  mongo_db:
    image: mongo:7.0
    container_name: mongo_db
    command: mongod --auth
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}

volumes:
  mongo_data: